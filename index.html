<header class="bg-white/90 backdrop-blur sticky top-0 z-50 border-b border-gray-100">

      <h1 class="text-base font-semibold text-gray-700">&#x1F33F; 宝宝营养看板</h1>

  </div>

<div id="bd-modal" class="fixed inset-0 z-[99] bg-black/30 flex items-center justify-center hidden">

</div>

function getStage(months){
  for(const s of STAGES) if(months>=s.min&&months<=s.max) return s;
  if(months>36) return STAGES[STAGES.length-1];
  return STAGES[0];
}

function calcMonths(birthday){
  const bd=new Date(birthday), now=new Date();
  return (now.getFullYear()-bd.getFullYear())*12+(now.getMonth()-bd.getMonth());
}

function getCurDRI(){
  const s=curStage();
  const d={};
  for(const k of NK) d[k]={...DRI[k], t:s.dri[k]||DRI[k].t};
  return d;
}

function curStage(){
  const m=birthday?calcMonths(birthday):17;
  return getStage(m);
}

function curPortion(){return curStage().portion}

function eid(d,mk,si,orig){return swaps[dk(d)]?.[mk]?.[si]||orig}

function nutr(d){
  const k=dk(d),plan=W[dow(d)].m,tot={},arr={},pf=curPortion();
  NK.forEach(n=>{tot[n]=0;arr[n]=0});
  for(const[mk,rids]of Object.entries(plan)){
    for(let si=0;si<rids.length;si++){
      const rid=eid(d,mk,si,rids[si]),r=R[rid];if(!r)continue;
      const iv=intake[k]?.[mk]?.[rid],fac=iv!==undefined?iv:-1;
      for(const g of r.i){const fd=F[g.food];if(!fd)continue;const m=g.grams*pf/100;
        NK.forEach(n=>{arr[n]+=fd[n]*m;if(fac>=0)tot[n]+=fd[n]*m*fac})}
    }
  }
  return{tot,arr}
}

function psrcs(d){
  const k=dk(d),plan=W[dow(d)].m,s=new Set();
  for(const[mk,rids]of Object.entries(plan))
    for(let si=0;si<rids.length;si++){const r=R[eid(d,mk,si,rids[si])];if(r?.ps)s.add(r.ps)}
  return s;
}

  ['day','week','growth'].forEach(v=>{

}

function renderDay(){
  const d=cur,k=dk(d),plan=W[dow(d)],{tot,arr}=nutr(d);

  const stg=curStage(), cDRI=getCurDRI(), pf=curPortion();

  // ── Stage tip (if portion != 1.0) ──
  if(pf!==1.0)h+=`<div class="bg-lv-50 rounded-xl px-3 py-2 mb-2 fade"><p class="text-[10px] text-lv-400">&#x1F4D0; 份量系数 ×${pf.toFixed(2)}（${stg.label}）· ${stg.texNote.slice(0,30)}...</p></div>`;

  // ── Nutrition bar ──
  h+=`<div class="bg-white rounded-xl p-3 mb-3 shadow-sm fade">
    <p class="text-[11px] font-semibold text-gray-500 mb-2">营养覆盖 <span class="font-normal text-gray-300">${stg.label}</span></p>
    <div class="space-y-1.5">`;
  for(const nk of NK){
    const info=cDRI[nk],val=hasRec?tot[nk]:arr[nk];
    const pct=Math.min(100,Math.round(val/info.t*100));
    const col=pct>=80?'#6BC87C':pct>=50?'#F0C24A':'#E87E7E';
    h+=`<div class="flex items-center gap-2">
      <span class="text-[10px] text-gray-400 w-8">${info.n}</span>
      <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
        <div class="bar-fill h-full rounded-full" style="width:${pct}%;background:${col}"></div>
      </div>
      <span class="text-[10px] w-16 text-right" style="color:${col}">${Math.round(val*10)/10}/${info.t}</span>
    </div>`;
  }
  h+=`</div><p class="text-[9px] text-gray-300 text-right mt-1">${hasRec?'按实际进食折算':'按计划量估算'}</p></div>`;

  // ── Meals ──
  for(const ml of MEALS){
    const rids=plan.m[ml.k]||[];
    h+=`<div class="bg-white rounded-xl mb-2.5 shadow-sm overflow-hidden fade">
      <div class="bg-${ml.bg}-50 px-3 py-1.5 flex items-center justify-between">

    for(let si=0;si<rids.length;si++){
      const rid=eid(d,ml.k,si,rids[si]),r=R[rid];if(!r)continue;
      const swapped=rid!==rids[si];

      const isOpen=openSwap===spk;

      // Card
      h+=`<div class="${swapped?'border-l-2 border-amber-300 pl-2':''}">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1.5 flex-1 min-w-0">
            <span class="text-xs font-medium text-gray-700 truncate">${r.n}</span>`;
      if(r.ps)h+=`<span class="text-[9px] px-1.5 py-0.5 rounded-full ${PS_TAG[r.ps].cls}">${PS_TAG[r.ps].l}</span>`;
      if(swapped)h+=`<span class="text-[9px] px-1 py-0.5 rounded bg-amber-50 text-amber-500">换</span>`;

        const alts=Object.entries(R).filter(([id,x])=>id!==rid&&x.t===r.t);

function renderGap(d){
  const k=dk(d),recorded=MEAL_KEYS.filter(m=>intake[k]?.[m]&&Object.keys(intake[k][m]).length>0);
  if(!recorded.length)return'';
  const pf=curPortion(),cDRI=getCurDRI();
  const eaten={};NK.forEach(n=>eaten[n]=0);
  const plan=W[dow(d)].m;
  for(const mk of recorded){
    const rids=plan[mk]||[];
    for(let si=0;si<rids.length;si++){
      const rid=eid(d,mk,si,rids[si]),r=R[rid];if(!r)continue;
      const iv=intake[k]?.[mk]?.[rid];if(iv===undefined)continue;
      for(const g of r.i){const fd=F[g.food];if(!fd)continue;const m=g.grams*pf/100;
        NK.forEach(n=>eaten[n]+=fd[n]*m*iv)}
    }
  }
  const remaining=MEAL_KEYS.filter(m=>!recorded.includes(m));
  const futArr={};NK.forEach(n=>futArr[n]=0);
  for(const mk of remaining){
    const rids=plan[mk]||[];
    for(let si=0;si<rids.length;si++){
      const r=R[eid(d,mk,si,rids[si])];if(!r)continue;
      for(const g of r.i){const fd=F[g.food];if(!fd)continue;const m=g.grams*pf/100;
        NK.forEach(n=>futArr[n]+=fd[n]*m)}
    }
  }
  const gaps=[];
  for(const nk of NK){
    const proj=eaten[nk]+futArr[nk],info=cDRI[nk],pct=Math.round(proj/info.t*100);
    if(pct<80)gaps.push({k:nk,n:info.n,pct,eaten:eaten[nk],t:info.t,u:info.u});
  }
  if(!gaps.length)return`<div class="bg-mt-50 rounded-xl p-3 mb-3 fade"><p class="text-xs text-mt-400 font-medium">&#x2705; 营养覆盖良好${remaining.length?'，按计划吃完即可':'!'}</p></div>`;
  const when=remaining.length?'接下来':'明天';
  let h=`<div class="bg-amber-50 rounded-xl p-3 mb-3 fade">
    <p class="text-xs font-medium text-amber-600 mb-2">&#x26A0;&#xFE0F; 营养缺口 · ${when}建议补充</p>`;
  for(const g of gaps){
    const tips=(GAP[g.k]||[]).slice(0,2).map(t=>`<span class="text-[9px] px-1.5 py-0.5 rounded bg-white text-amber-600">${t.d}</span>`).join(' ');
    h+=`<div class="mb-1.5"><div class="flex items-center justify-between"><span class="text-[10px] text-gray-600">${g.n}</span><span class="text-[10px] text-amber-500">${Math.round(g.eaten*10)/10}/${g.t}${g.u} (${g.pct}%)</span></div><div class="flex gap-1 mt-0.5">${tips}</div></div>`;
  }
  h+=`</div>`;return h;
}

function renderWeek(){
  const mon=new Date(cur);mon.setDate(mon.getDate()-dow(mon));
  const dn=['一','二','三','四','五','六','日'];
  let h='';

  // ── Week grid: compact calendar ──
  h+=`<div class="bg-white rounded-xl p-3 mb-3 shadow-sm fade">
    <p class="text-[11px] font-semibold text-gray-500 mb-2">一周概览</p>
    <div class="grid grid-cols-7 gap-1">`;
  for(let i=0;i<7;i++)h+=`<div class="text-[9px] text-gray-400 text-center font-medium">${dn[i]}</div>`;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(d.getDate()+i);
    const k=dk(d),isToday=dk(d)===dk(new Date()),isSel=dk(d)===dk(cur);
    const srcs=psrcs(d);
    const hasI=!!intake[k]&&Object.keys(intake[k]).length>0;
    h+=`<div onclick="pickDay(${d.getTime()})" class="rounded-lg p-1.5 text-center cursor-pointer ${isSel?'ring-1.5 ring-pk-400 bg-pk-50':isToday?'bg-pc-50':'bg-gray-50'} hover:bg-pk-50/50">
      <div class="text-[10px] font-medium ${isToday?'text-pk-400':'text-gray-500'}">${d.getDate()}</div>
      <div class="flex flex-wrap gap-0.5 justify-center mt-0.5">
        ${[...srcs].map(s=>`<span class="w-1.5 h-1.5 rounded-full" style="background:${DRI[{poultry:'va',livestock:'p',fish:'dha',bean:'zn',egg:'ca'}[s]||'p'].color}"></span>`).join('')}
      </div>
      ${hasI?'<div class="text-[8px] text-mt-400 mt-0.5">&#x2714;</div>':''}
    </div>`;
  }
  h+=`</div></div>`;

  // ── Protein distribution ──
  h+=`<div class="bg-white rounded-xl p-3 mb-3 shadow-sm fade">
    <p class="text-[11px] font-semibold text-gray-500 mb-2">蛋白质来源</p>
    <div class="space-y-1.5">`;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(d.getDate()+i);
    const k2=dk(d),plan=W[dow(d)].m,seen=[];
    for(const[mk,rids]of Object.entries(plan))
      for(let si=0;si<rids.length;si++){
        const r=R[eid(d,mk,si,rids[si])];
        if(r?.ps&&!seen.find(x=>x.ps===r.ps&&x.n===r.n))seen.push({ps:r.ps,n:r.n})}
    h+=`<div class="flex items-center gap-2">
      <span class="text-[10px] text-gray-400 w-4">${dn[i]}</span>
      <div class="flex gap-1 flex-wrap flex-1">
        ${seen.map(s=>`<span class="text-[9px] px-1.5 py-0.5 rounded-full ${PS_TAG[s.ps].cls}">${s.n}</span>`).join('')}
      </div></div>`;
  }
  h+=`</div></div>`;

  // ── Week nutrition ──
  const cDRI=getCurDRI();
  h+=`<div class="bg-white rounded-xl p-3 mb-3 shadow-sm fade">
    <p class="text-[11px] font-semibold text-gray-500 mb-2">每日营养</p>
    <div class="flex gap-1 mb-1.5">
      ${NK.map(k=>`<span class="flex-1 text-[8px] text-center text-gray-400">${cDRI[k].n}</span>`).join('')}
    </div>`;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(d.getDate()+i);
    const {arr}=nutr(d);
    h+=`<div class="flex items-center gap-1 mb-1"><span class="text-[10px] text-gray-400 w-4">${dn[i]}</span><div class="flex gap-1 flex-1">`;
    for(const nk of NK){
      const pct=Math.min(100,Math.round(arr[nk]/cDRI[nk].t*100));
      const col=pct>=80?'#6BC87C':pct>=50?'#F0C24A':'#E87E7E';
      h+=`<div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:${col}"></div></div>`;
    }
    h+=`</div></div>`;
  }
  h+=`</div>`;
  return h;
}

// ═══════════ GROWTH VIEW ═══════════
function renderGrowth(){
  const months=birthday?calcMonths(birthday):17;
  const stg=curStage();
  let h='';

  // Current stage card
  h+=`<div class="bg-white rounded-xl p-4 mb-3 shadow-sm fade">
    <div class="flex items-center justify-between mb-2">
      <p class="text-sm font-semibold text-gray-700">${months}月龄</p>
      <button onclick="openBdModal()" class="text-[10px] text-pk-400">修改生日</button>
    </div>
    <div class="bg-pk-50 rounded-lg p-3 mb-3">
      <p class="text-xs font-medium text-pk-400 mb-1">当前阶段：${stg.label}</p>
      <p class="text-[11px] text-gray-600">${stg.phase}</p>
    </div>
    <div class="mb-2">
      <p class="text-[11px] font-medium text-gray-600 mb-1">质地要求</p>
      <p class="text-[10px] text-gray-500">${stg.texNote}</p>
    </div>
    <div class="mb-2">
      <p class="text-[11px] font-medium text-gray-600 mb-1">份量系数</p>
      <p class="text-[10px] text-gray-500">基础食谱 ×${stg.portion.toFixed(2)}（随月龄自动增加）</p>
    </div>`;
  if(stg.unlock.length){
    h+=`<div><p class="text-[11px] font-medium text-gray-600 mb-1">本阶段解锁</p>`;
    for(const u of stg.unlock) h+=`<span class="inline-block text-[10px] px-2 py-0.5 rounded-full bg-mt-50 text-mt-400 mr-1 mb-1">&#x2705; ${u}</span>`;
    h+=`</div>`;
  }
  h+=`</div>`;

  // Nutrition targets comparison
  h+=`<div class="bg-white rounded-xl p-4 mb-3 shadow-sm fade">
    <p class="text-[11px] font-semibold text-gray-500 mb-2">各阶段营养目标</p>
    <div class="overflow-x-auto"><table class="w-full text-[10px]">
      <tr class="border-b border-gray-100">
        <td class="py-1 text-gray-400">阶段</td>
        ${NK.map(k=>`<td class="py-1 text-center text-gray-400">${DRI[k].n}</td>`).join('')}
        <td class="py-1 text-center text-gray-400">份量</td>
      </tr>`;
  for(const s of STAGES){
    const isCur=months>=s.min&&months<=s.max;
    h+=`<tr class="${isCur?'bg-pk-50 font-medium':''}">
      <td class="py-1.5 ${isCur?'text-pk-400':'text-gray-500'}">${s.label}${isCur?' &#x25C0;':''}</td>
      ${NK.map(k=>`<td class="py-1.5 text-center ${isCur?'text-pk-400':'text-gray-500'}">${s.dri[k]}</td>`).join('')}
      <td class="py-1.5 text-center ${isCur?'text-pk-400':'text-gray-500'}">×${s.portion.toFixed(2)}</td>
    </tr>`;
  }
  h+=`</table></div></div>`;

  // Timeline
  h+=`<div class="bg-white rounded-xl p-4 mb-3 shadow-sm fade">
    <p class="text-[11px] font-semibold text-gray-500 mb-3">成长时间线</p>
    <div class="relative pl-4 border-l-2 border-gray-100 space-y-4">`;
  for(const s of STAGES){
    const isCur=months>=s.min&&months<=s.max;
    const isPast=months>s.max;
    const dotCls=isCur?'bg-pk-400':'isPast'?'bg-mt-400':'bg-gray-200';
    h+=`<div class="relative">
      <div class="absolute -left-[21px] top-0.5 w-3 h-3 rounded-full ${isCur?'bg-pk-400 ring-2 ring-pk-100':isPast?'bg-mt-400':'bg-gray-200'}"></div>
      <p class="text-xs ${isCur?'font-semibold text-pk-400':isPast?'text-gray-500':'text-gray-400'}">${s.label} · ${s.phase}</p>
      <p class="text-[10px] text-gray-400 mt-0.5">${s.texNote}</p>`;
    if(s.unlock.length)h+=`<div class="mt-1">${s.unlock.map(u=>`<span class="inline-block text-[9px] px-1.5 py-0.5 rounded bg-mt-50 text-mt-400 mr-1 mb-0.5">${u}</span>`).join('')}</div>`;
    h+=`</div>`;
  }
  h+=`</div></div>`;

  return h;
}

// ═══════════ ACTIONS ═══════════
function go(n){cur.setDate(cur.getDate()+(view==='week'?n*7:n));openSwap=null;render()}
function setView(v){view=v;openSwap=null;render()}
function pickDay(ts){cur=new Date(ts);view='day';openSwap=null;render()}
function setI(k,mk,rid,v){
  if(!intake[k])intake[k]={};if(!intake[k][mk])intake[k][mk]={};
  intake[k][mk][rid]===v?delete intake[k][mk][rid]:intake[k][mk][rid]=v;
  save();render();
}
function toggleSwap(mk,si){const s=`${mk}-${si}`;openSwap=openSwap===s?null:s;render()}
function doSwap(k,mk,si,nid){
  if(!swaps[k])swaps[k]={};if(!swaps[k][mk])swaps[k][mk]={};
  swaps[k][mk][si]=nid;
  if(intake[k]?.[mk]){const plan=W[dow(cur)].m;delete intake[k][mk][plan[mk]?.[si]];delete intake[k][mk][nid]}
  openSwap=null;save();render();
}
function undoSwap(k,mk,si){if(swaps[k]?.[mk])delete swaps[k][mk][si];openSwap=null;save();render()}

// ═══════════ INIT ═══════════
load();render();
</script>
